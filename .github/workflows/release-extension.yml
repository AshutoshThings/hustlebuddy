name: Release extension

on:
  push:
    tags:
      - "extension-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Extension version, e.g. 1.2.0"
        required: true

permissions:
  contents: write # needed to create the release

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: v
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#extension-v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build extension
        env:
          EXTENSION_APP_ORIGIN: ${{ vars.EXTENSION_APP_ORIGIN }}
          EXTENSION_VERSION: ${{ steps.v.outputs.version }}
        run: node scripts/build-extension.mjs

      - name: Zip
        run: |
          cd dist/extension
          zip -r -X ../hustlebuddy-extension.zip .

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: extension-v${{ steps.v.outputs.version }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/hustlebuddy-extension.zip --clobber
          else
            gh release create "$TAG" dist/hustlebuddy-extension.zip \
              --target "$GITHUB_SHA" \
              --title "HustleBuddy extension v$VERSION" \
              --notes "Unzip, open chrome://extensions, turn on Developer mode, then Load unpacked." \
              --latest
          fi
