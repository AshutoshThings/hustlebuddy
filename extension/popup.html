<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>HustleBuddy</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        width: 320px;
        margin: 0;
        padding: 16px;
        background: #0a0a0a;
        color: #e5e5e5;
        font:
          13px/1.4 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 12px;
        color: #fff;
        font-weight: 600;
      }
      p {
        margin: 0 0 12px;
        color: #999;
      }
      label {
        display: block;
        margin-bottom: 10px;
        color: #999;
        font-size: 12px;
      }
      input,
      select {
        display: block;
        width: 100%;
        margin-top: 4px;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid #2a2a2a;
        background: #111;
        color: #fff;
        font: inherit;
      }
      input:focus,
      select:focus {
        outline: none;
        border-color: #bbb;
      }
      button.primary {
        width: 100%;
        padding: 9px;
        border: 0;
        border-radius: 8px;
        background: #fff;
        color: #000;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button.primary:disabled {
        opacity: 0.5;
        cursor: default;
      }
      button.link {
        margin-top: 10px;
        padding: 0;
        background: none;
        border: 0;
        color: #777;
        font: inherit;
        cursor: pointer;
      }
      button.link:hover {
        color: #fff;
      }
      .notice {
        margin-bottom: 12px;
        padding: 8px 10px;
        border-radius: 8px;
        background: #151515;
        border: 1px solid #2a2a2a;
        color: #bbb;
        font-size: 12px;
      }
      .hidden {
        display: none;
      }
      #statusMsg {
        margin: 10px 0 0;
        min-height: 16px;
        color: #999;
      }
      #statusMsg.success {
        color: #34d399;
      }
      #statusMsg.error {
        color: #f87171;
      }
    </style>
  </head>
  <body>
    <div id="signedOut" class="hidden">
      <h1>HustleBuddy</h1>
      <p id="signedOutMsg"></p>
      <button id="connectBtn" class="primary">Connect account</button>
    </div>

    <div id="signedIn" class="hidden">
      <h1>Track this application</h1>
      <div id="noticeBox" class="notice hidden">
        Details detected from this page. Check them before saving.
      </div>
      <form id="jobForm">
        <label>Company <input id="company" required /></label>
        <label>Role <input id="role" required /></label>
        <label
          >Status
          <select id="status">
            <option value="applied">Applied</option>
            <option value="interviewing">Interviewing</option>
            <option value="offered">Offered</option>
            <option value="rejected">Rejected</option>
          </select>
        </label>
        <button id="saveBtn" type="submit" class="primary">
          Save to HustleBuddy
        </button>
        <p id="statusMsg"></p>
      </form>
      <button id="disconnectBtn" class="link">Disconnect</button>
    </div>

    <script src="config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
